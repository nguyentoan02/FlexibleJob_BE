name: 🚀 Deploy to EC2 via Rolling Update

on:
    push:
        branches:
            - feat/merge

env:
    SSH_USER: ec2-user
    APP_DIR: /home/ec2-user/app
    REPO: https://github.com/nguyentoan02/FlexibleJob_BE.git
    DOCKER_IMAGE: myapp:latest
    DEPLOY_PORT: 6000

jobs:
    deploy:
        name: Rolling Deploy to EC2
        runs-on: ubuntu-latest

        steps:
            - name: 📥 Checkout code
              uses: actions/checkout@v3

            - name: 🔐 Setup key, .env and Deploy
              run: |
                  echo "${{ secrets.EC2_KEY }}" > key.pem
                  chmod 400 key.pem

                  echo "${{ secrets.ENV_FILE }}" > .env.temp

                  HOSTS=(${{ secrets.EC2_HOSTS }})

                  for HOST in "${HOSTS[@]}"; do
                    echo "👉 Deploying to $HOST"

                    ssh -o StrictHostKeyChecking=no -i key.pem $SSH_USER@$HOST "mkdir -p $APP_DIR"

                    scp -o StrictHostKeyChecking=no -i key.pem .env.temp $SSH_USER@$HOST:$APP_DIR/.env

                    ssh -o StrictHostKeyChecking=no -i key.pem $SSH_USER@$HOST << 'EOF'
                    set -e
                    cd /home/ec2-user/app

                    # Kiểm tra file .env có tồn tại không
                    if [ ! -f ".env" ]; then
                      echo "❌ .env file not found!"
                      exit 1
                    fi

                    # Backup file .env TRƯỚC KHI git operations
                    cp .env .env.backup

                    if [ -d ".git" ]; then
                      echo "📁 Existing git repository found, updating..."
                      git fetch origin
                      git checkout feat/merge
                      git reset --hard origin/feat/merge
                      git pull origin feat/merge
                      
                      # Copy lại file .env sau khi git pull
                      if [ -f ".env.backup" ]; then
                        cp .env.backup .env
                        echo "✅ Restored .env from backup after git pull"
                      fi
                    else
                      echo "🆕 No git repository found, cloning..."
                      # Backup .env to parent directory before removing everything
                      cp .env ../.env.backup.temp
                      
                      rm -rf ./*
                      rm -rf ./.*
                      git clone -b feat/merge https://github.com/nguyentoan02/FlexibleJob_BE.git .
                      
                      # Restore .env from parent directory
                      if [ -f "../.env.backup.temp" ]; then
                        cp ../.env.backup.temp .env
                        rm ../.env.backup.temp
                        echo "✅ Restored .env from temporary backup after git clone"
                      else
                        echo "❌ No temporary .env backup found!"
                        exit 1
                      fi
                    fi

                    docker build -t myapp:latest .

                    # THÊM: Dọn dẹp tất cả containers cũ trước khi tạo mới
                    echo "🧹 Cleaning up old containers..."
                    docker stop myapp_new myapp 2>/dev/null || true
                    docker rm myapp_new myapp 2>/dev/null || true

                    # Tạo container mới
                    docker run -d --name myapp_new -p 6001:5000 --env-file /home/ec2-user/app/.env myapp:latest

                    sleep 10

                    # Kiểm tra container có chạy thành công không
                    if [ "$(docker ps -q -f name=myapp_new)" ]; then
                      echo "✅ New container is running successfully"
                      
                      # Rename container mới thành tên chính
                      docker rename myapp_new myapp
                    else
                      echo "❌ New container failed to start"
                      docker logs myapp_new
                      exit 1
                    fi

                    docker system prune -af

                    echo "✅ Done on $HOST"
                  EOF

                    echo "🕒 Waiting before next deploy..."
                    sleep 10
                  done
